name: XPE Bot Build and Release
# XPE Bot — automatic build workflow.
# Copyright (c) 2026 xpe.nettt. MIT License.
#
# Build en cada push a main; en tags v* publica:
#   XPEBot-<tag>.zip          (paquete portable, autocontenido con runtime VC++)
#   XPEBot-Setup-<version>.exe (instalador Inno Setup, instalacion por usuario)
#   SHA256SUMS.txt            (checksums de los dos anteriores)

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xpe-bot-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: XPE Bot — Windows x64 build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository data
        shell: pwsh
        run: |
          Get-ChildItem data -Filter *.json -Recurse | ForEach-Object {
            Get-Content -Raw -LiteralPath $_.FullName | ConvertFrom-Json | Out-Null
          }

      - name: Install Slint C++
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $slintDir = 'C:\Slint-cpp-1.17.1'
          $installer = "$env:RUNNER_TEMP\Slint-cpp-1.17.1.exe"
          Invoke-WebRequest 'https://github.com/slint-ui/slint/releases/download/v1.17.1/Slint-cpp-1.17.1-win64-MSVC-AMD64.exe' -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList "/S", "/D=$slintDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Slint installation failed with exit code $($process.ExitCode)." }
          @("$slintDir\bin\slint-compiler.exe", "$slintDir\lib\slint_cpp.dll", "$slintDir\lib\slint_cpp.dll.lib") | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_)) { throw "Missing Slint component: $_" }
          }
          "SLINT_DIR=$slintDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release -Platform x64 -SlintDir $env:SLINT_DIR

      - name: Package runtime
        shell: pwsh
        run: |
          $binary = Get-ChildItem x64\Release -Filter *.exe -File | Select-Object -First 1
          if ($null -eq $binary) { throw 'Release executable was not produced.' }
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "build-$env:GITHUB_RUN_NUMBER" }
          ./scripts/package_release.ps1 -BinaryPath $binary.FullName -SlintDir $env:SLINT_DIR -Version $version
          $clean = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v', '' } else { "0.0.$env:GITHUB_RUN_NUMBER" }
          "XPE_VERSION=$clean" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'Inno Setup compiler (ISCC.exe) was not found.' }
          $packageDir = Get-ChildItem dist -Directory | Select-Object -First 1
          if ($null -eq $packageDir) { throw 'Packaged output directory was not found.' }
          $outputDir = Join-Path $PWD 'dist\installer'
          & $iscc "/DAppVersion=$env:XPE_VERSION" "/DSourceDir=$($packageDir.FullName)" "/DOutputDir=$outputDir" 'installer\XPEBot.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE." }
          Get-ChildItem $outputDir

      - name: Upload runtime package
        uses: actions/upload-artifact@v4
        with:
          name: XPEBot-windows-x64
          path: |
            dist/*.zip
            dist/installer/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish XPE Bot GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: XPEBot-windows-x64
          path: release-assets

      - name: Collect release assets
        run: |
          mkdir -p out
          find release-assets -type f \( -name '*.zip' -o -name '*.exe' \) -exec cp {} out/ \;
          ls -la out
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            out/*.zip
            out/*.exe
            out/SHA256SUMS.txt
