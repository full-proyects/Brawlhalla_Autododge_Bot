name: XPE Bot Auto Release
# Publica una version nueva sin tocar el repo a mano:
#   1. calcula la siguiente version a partir del ultimo tag v*
#   2. actualiza src/app.rc (version que muestra Windows y que lee el auto-update)
#   3. commitea en main y crea el tag anotado
#   4. dispara el workflow de build/release sobre ese tag
#
# Nota: los tags creados con el GITHUB_TOKEN no disparan otros workflows, por eso
# el release se lanza explicitamente con `gh workflow run`.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Componente de version a incrementar'
        type: choice
        options: [patch, minor, major]
        default: patch
      notes:
        description: 'Nota corta para el commit de release (opcional)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: xpe-bot-auto-release
  cancel-in-progress: false

jobs:
  release:
    name: Bump version y tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular siguiente version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          latest="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          latest="${latest:-v0.0.0}"
          ver="${latest#v}"
          IFS='.' read -r major minor patch <<< "$ver"
          major="${major:-0}"; minor="${minor:-0}"; patch="${patch:-0}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *)     patch=$((patch + 1)) ;;
          esac
          echo "previous=${latest}" >> "$GITHUB_OUTPUT"
          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "clean=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

      - name: Actualizar src/app.rc
        env:
          VERSION: ${{ steps.version.outputs.clean }}
        run: |
          python3 - <<'EOF'
          import os, re, pathlib
          version = os.environ["VERSION"]
          parts = version.split(".")
          while len(parts) < 3:
              parts.append("0")
          numeric = ",".join(parts + ["0"])
          text = pathlib.Path("src/app.rc").read_text(encoding="utf-8")
          text = re.sub(r"(#define VER_FILEVERSION\s+).*", r"\g<1>" + numeric, text)
          text = re.sub(r"(#define VER_FILEVERSION_STR\s+).*", r'\g<1>"' + version + '.0\\\\0"', text)
          text = re.sub(r"(#define VER_PRODUCTVERSION\s+).*", r"\g<1>" + numeric, text)
          text = re.sub(r"(#define VER_PRODUCTVERSION_STR\s+).*", r'\g<1>"' + version + '.0\\\\0"', text)
          pathlib.Path("src/app.rc").write_text(text, encoding="utf-8")
          print(text[:400])
          EOF

      - name: Commit y tag
        id: commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.clean }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          git config user.name "xpe-release-bot"
          git config user.email "release@xpe.nettt"
          git add src/app.rc
          if git diff --cached --quiet; then
            echo "app.rc ya estaba en $VERSION"
          else
            git commit -m "Release ${TAG}: bump de version a ${VERSION}"
            git push origin HEAD:main
          fi
          git tag -a "$TAG" -m "XPE Bot ${VERSION}${NOTES:+ - $NOTES}"
          git push origin "$TAG"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Disparar build y release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.commit.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "Release $TAG disparado."
